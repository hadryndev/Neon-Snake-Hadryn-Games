<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0a1020">
<title>NEON SNAKE — Hadryn Games</title>
<style>
:root{color-scheme:dark;--bg:#080e19;--panel:#111c2d;--text:#e8f8fa;--sub:#91a8b8;--green:#64ffc1;--pink:#ff658e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#17304a 0%,var(--bg) 55%);color:var(--text);font:500 16px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}.app{width:min(100%,650px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.eyebrow{letter-spacing:.28em;color:var(--green);font-size:.7rem;font-weight:800}h1{margin:4px 0 0;font-size:clamp(2rem,7vw,3.2rem);letter-spacing:-.06em;line-height:1}h1 span{color:var(--green)}.tag{font-size:.72rem;color:var(--sub);border:1px solid #39506a;border-radius:999px;padding:8px 12px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.stat{background:var(--panel);border:1px solid #294053;border-radius:14px;padding:12px 16px}.stat small{display:block;color:var(--sub);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}.stat strong{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums} .board-shell{position:relative;padding:9px;background:linear-gradient(145deg,#2b4f61,#112234);border:1px solid #45697a;border-radius:20px;box-shadow:0 22px 65px #0008,0 0 45px #36e1ab12}canvas{display:block;width:100%;aspect-ratio:1;image-rendering:auto;background:#091727;border-radius:12px;touch-action:none}.overlay{position:absolute;inset:9px;display:grid;place-items:center;background:#07121de8;border-radius:12px;text-align:center;padding:24px;backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.overlay-content{max-width:350px}.icon{font-size:3rem;margin-bottom:8px}.overlay h2{font-size:2rem;margin:0 0 8px}.overlay p{color:var(--sub);line-height:1.5;margin:0 0 20px}button{font:inherit;cursor:pointer;color:var(--bg);background:var(--green);border:0;border-radius:11px;padding:12px 20px;font-weight:800;transition:transform .12s,filter .12s}button:hover{filter:brightness(1.09)}button:active{transform:scale(.96)}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px}.hint{font-size:.81rem;color:var(--sub);line-height:1.5}.actions{display:flex;gap:8px}.secondary{background:#20364a;border:1px solid #39576a;color:var(--text)}.mobile-controls{display:none;justify-content:center;grid-template-columns:repeat(3,58px);gap:6px;margin:19px auto 0}.mobile-controls button{height:53px;padding:0;background:#203a4e;color:var(--green);font-size:1.3rem;touch-action:manipulation}.mobile-controls .up{grid-column:2}.mobile-controls .left{grid-column:1;grid-row:2}.mobile-controls .down{grid-column:2;grid-row:2}.mobile-controls .right{grid-column:3;grid-row:2}@media(pointer:coarse),(max-width:600px){.mobile-controls{display:grid}.footer{align-items:flex-start}.hint{max-width:230px}.tag{display:none}}@media(max-width:390px){.stat{padding:10px}.stat strong{font-size:1.3rem}.footer{flex-wrap:wrap}}
</style>
</head>
<body>
<main class="app">
<header><div><div class="eyebrow">ARCADE COLLECTION</div><h1>NEON <span>SNAKE</span></h1></div><div class="tag">HADRYN GAMES • v1.0</div></header>
<section class="scores" aria-label="Pontuação"><div class="stat"><small>Pontos</small><strong id="score">0</strong></div><div class="stat"><small>Recorde</small><strong id="best">0</strong></div><div class="stat"><small>Nível</small><strong id="level">1</strong></div></section>
<div class="board-shell"><canvas id="game" width="600" height="600" role="img" aria-label="Tabuleiro do jogo Snake"></canvas><div class="overlay" id="overlay"><div class="overlay-content"><div class="icon" id="overlayIcon">🐍</div><h2 id="overlayTitle">Pronto para jogar?</h2><p id="overlayText">Coma os pontos rosas, cresça e evite bater nas paredes ou em você mesmo.</p><button id="start">Começar jogo</button></div></div></div>
<div class="footer"><div class="hint">Mover: <b>WASD</b> ou <b>setas</b><br>Pausar: <b>Espaço</b> • No celular, deslize na tela.</div><div class="actions"><button class="secondary" id="pause">Pausar</button><button class="secondary" id="restart">Reiniciar</button></div></div>
<div class="mobile-controls" aria-label="Controles de direção"><button class="up" data-dir="up" aria-label="Cima">▲</button><button class="left" data-dir="left" aria-label="Esquerda">◀</button><button class="down" data-dir="down" aria-label="Baixo">▼</button><button class="right" data-dir="right" aria-label="Direita">▶</button></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),N=20,C=canvas.width/N;
const el=id=>document.getElementById(id);const scoreEl=el('score'),bestEl=el('best'),levelEl=el('level'),overlay=el('overlay');
let best=0;try{best=Number(localStorage.getItem('neon-snake-best'))||0}catch{}bestEl.textContent=best;
let snake,food,dir,nextDir,score,steps,running=false,paused=false,last=0,acc=0;
const vectors={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};nextDir=dir;score=0;steps=0;food=spawn();updateStats();acc=0;last=0;draw()}
function spawn(){const available=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))available.push({x,y});return available.length?available[Math.floor(Math.random()*available.length)]:null}
function level(){return Math.min(12,1+Math.floor(score/50))}function interval(){return Math.max(66,150-(level()-1)*8)}
function updateStats(){scoreEl.textContent=score;levelEl.textContent=level();bestEl.textContent=best}
function show(title,message,icon,button){el('overlayTitle').textContent=title;el('overlayText').textContent=message;el('overlayIcon').textContent=icon;el('start').textContent=button;overlay.hidden=false}
function start(){reset();running=true;paused=false;overlay.hidden=true;el('pause').textContent='Pausar'}
function end(won=false){running=false;show(won?'Você venceu!':'Fim de jogo',won?'Você preencheu todo o tabuleiro!':`Você fez ${score} pontos. Que tal tentar de novo?`,won?'🏆':'💥','Jogar novamente')}
function turn(name){const v=vectors[name];if(!v)return;if(v.x===-dir.x&&v.y===-dir.y)return;nextDir=v}
function tick(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eating=food&&head.x===food.x&&head.y===food.y;const body=eating?snake:snake.slice(0,-1);if(head.x<0||head.x>=N||head.y<0||head.y>=N||body.some(p=>p.x===head.x&&p.y===head.y)){end();return}snake.unshift(head);if(eating){score+=10;if(score>best){best=score;try{localStorage.setItem('neon-snake-best',String(best))}catch{}}food=spawn();updateStats();if(!food){end(true);return}}else snake.pop();steps++}
function rect(x,y,color,r=7,inset=2){const px=x*C+inset,py=y*C+inset,s=C-inset*2;ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(px,py,s,s,r);ctx.fill()}
function draw(){ctx.fillStyle='#091727';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#ffffff07';ctx.lineWidth=1;for(let i=1;i<N;i++){const p=i*C+.5;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,600);ctx.moveTo(0,p);ctx.lineTo(600,p);ctx.stroke()}if(food){ctx.shadowBlur=20;ctx.shadowColor='#ff658e';rect(food.x,food.y,'#ff658e',9,6);ctx.shadowBlur=0}snake.forEach((s,i)=>{if(i===0){ctx.shadowBlur=15;ctx.shadowColor='#64ffc1';rect(s.x,s.y,'#64ffc1',8,2);ctx.shadowBlur=0;ctx.fillStyle='#0a2832';const eyex=s.x*C+C/2+dir.x*5,eyey=s.y*C+C/2+dir.y*5;ctx.beginPath();ctx.arc(eyex-dir.y*5,eyey+dir.x*5,2.5,0,Math.PI*2);ctx.arc(eyex+dir.y*5,eyey-dir.x*5,2.5,0,Math.PI*2);ctx.fill()}else rect(s.x,s.y,i%2?'#33c69d':'#29b18c',6,3)})}
function frame(t){if(running&&!paused){if(!last)last=t;acc+=Math.min(t-last,250);while(acc>=interval()&&running){tick();acc-=interval()}last=t;draw()}else last=t;requestAnimationFrame(frame)}
function pause(){if(!running)return;paused=!paused;el('pause').textContent=paused?'Continuar':'Pausar';if(paused)show('Pausado','Pressione Espaço ou clique para continuar.','⏸️','Continuar');else{overlay.hidden=true;last=0;acc=0}}
el('start').addEventListener('click',()=>{if(running&&paused)pause();else start()});el('restart').addEventListener('click',start);el('pause').addEventListener('click',pause);
window.addEventListener('keydown',e=>{const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};const d=keys[e.key]||keys[e.key.toLowerCase?.()];if(d){e.preventDefault();if(!running&&!paused)start();turn(d)}else if(e.code==='Space'){e.preventDefault();if(running)pause();else start()}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{if(!running)start();turn(b.dataset.dir)}));
let swipe=null;canvas.addEventListener('pointerdown',e=>{swipe={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',e=>{if(!swipe)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(!running)start();turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
reset();requestAnimationFrame(frame);
})();
</script>
</body></html>
